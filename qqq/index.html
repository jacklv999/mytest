<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQQ 3倍做多 · 运行监控</title>
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f7fa;--card:#ffffff;--line:#e6eaf0;
  --txt:#1f2937;--muted:#64748b;--up:#059669;--down:#dc2626;
  --accent:#0ea5e9;--accent2:#14b8a6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--txt);
  font-family:"SF Pro Display",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:56px 28px 40px}
.label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
h1{font-size:34px;font-weight:600;letter-spacing:.01em;margin-top:10px}
.meta{margin-top:10px;font-size:13px;color:var(--muted)}
.meta b{color:var(--txt);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:24px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:12px;color:var(--muted);margin-top:6px}
.pos{color:var(--up)}.neg{color:var(--down)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px 16px;margin-top:14px}
.panel .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chart{width:100%;display:block;margin-top:10px}
.tip{position:fixed;pointer-events:none;background:#ffffff;border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:12px;color:var(--txt);display:none;z-index:9;
  box-shadow:0 8px 24px rgba(15,23,42,.12);font-variant-numeric:tabular-nums}
.tip .d{color:var(--muted)}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.mtile .mm{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.mtile .mv{font-size:24px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}
.mtile .ms{font-size:12px;color:var(--muted);margin-top:6px}
.foot{margin-top:30px;font-size:12px;color:var(--muted);line-height:1.8}
.empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
@media(max-width:760px){
  .wrap{padding:28px 16px 28px}
  .label{font-size:10px}
  h1{font-size:22px}
  .meta{font-size:12px;line-height:1.7}
  .kpis{gap:10px;margin-top:20px}
  .card{padding:13px 14px;border-radius:12px}
  .card .v{font-size:18px;margin-top:6px}
  .card .s{font-size:11px}
  .panel{padding:16px 12px 10px;border-radius:12px}
  .panel .k{font-size:10px}
  .mtiles{gap:10px}
  .mtile .mv{font-size:19px}
  .mtile .ms{font-size:11px}
  .foot{margin-top:22px;font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">Operations Monitor</div>
  <h1>QQQ 3倍做多 · 运行监控</h1>
  <div class="meta" id="meta">加载中…</div>

  <div class="kpis">
    <div class="card"><div class="k">当前权益</div><div class="v" id="k-eq">—</div><div class="s">最新采样点</div></div>
    <div class="card"><div class="k">开仓权益</div><div class="v" id="k-open">—</div><div class="s" id="k-open-s">策略申报 · 对比当前</div></div>
    <div class="card"><div class="k">当日变动</div><div class="v" id="k-day">—</div><div class="s">最近一个采样区间</div></div>
    <div class="card"><div class="k">窗口盈亏</div><div class="v" id="k-pnl">—</div><div class="s">近两月合计</div></div>
  </div>

  <div class="panel">
    <div class="k">权益曲线</div>
    <div id="chart-box"></div>
  </div>

  <div class="panel">
    <div class="k" id="bar-title">每日盈亏 · USD</div>
    <div id="bar-box"></div>
  </div>

  <div class="mtiles" id="mtiles"></div>

  <div class="foot">
    本页为运行监控视图，仅覆盖数据窗口<br>
    数据源：逐分钟运行日志（每桶取开始时间的数据）· 无记录时段自动跳过 · 数据更新：<span id="updated">—</span>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=(x,d=2)=>x==null?"—":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=x=>x==null?"—":(x>0?"+":"")+fmt(x)+"%";
const cls=x=>x==null?"":(x>=0?"pos":"neg");
const GL_TEXT={minute:{tile:"个分钟点",bar:"逐分钟盈亏"},
               hour:{tile:"个小时点",bar:"每小时盈亏"},
               day:{tile:"个交易日",bar:"每日盈亏"}};
const glText=(g,key)=>(GL_TEXT[g]||GL_TEXT.minute)[key];

let LAST=null;
let rzTimer=null;

function flat(data){const d=[];data.months.forEach(m=>(m.points||[]).forEach(x=>d.push(x)));return d;}

/* 图表几何：viewBox = 容器实际像素宽，字号线宽恒为屏幕像素，窄屏不缩小 */
function chartGeom(box,baseH){
  const W=Math.max(320,Math.min(940,Math.round(box.clientWidth||940)));
  const narrow=W<600;
  const H=narrow&&baseH>200?240:baseH;
  const P={l:narrow?58:64,r:narrow?8:16,t:14,b:narrow?26:30};
  return {W,H,P,narrow:narrow};
}

/* 采样点超过绘图区像素宽时按桶开始时间降采样，保证每个元素至少 1px */
function downsample(points,maxN){
  const n=Math.max(60,Math.floor(maxN));
  if(points.length<=n)return points;
  const out=[];
  const bucket=Math.ceil(points.length/n);
  for(let i=0;i<points.length;i+=bucket)out.push(points[i]);
  return out;
}

async function load(){
  let data;
  try{
    const signal=(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)?AbortSignal.timeout(15000):undefined;
    const r=await fetch(window.API_URL,{signal:signal});
    const payload=await r.json();
    if(payload.code!==0){$("meta").textContent="接口返回错误："+(payload.msg||"未知错误");return;}
    data=payload.data;
  }catch(e){
    $("meta").textContent="数据加载失败（"+(e&&e.name==="TimeoutError"?"15 秒超时":(e&&e.message)||"网络/配置异常")+"），请检查 config.js 的 API_URL 与网络";
    return;
  }
  if(!data||data.months==null){$("meta").textContent="接口返回异常";return;}
  $("updated").textContent=data.updated||"—";
  LAST=data;
  $("bar-title").textContent=glText(data.granularity,"bar")+" · USD";

  const d=flat(data);
  if(d.length<2){$("meta").textContent="数据窗口内暂无运行记录";return;}

  $("meta").innerHTML="数据窗口 <b>"+d[0].date+" → "+d[d.length-1].date
    +"</b> · 当前权益 <b>"+fmt(d[d.length-1].equity)+" USD</b>";

  const pnl=d[d.length-1].equity-d[0].equity;
  const dr=d[d.length-1].equity-d[d.length-2].equity;
  const drPct=dr/d[d.length-2].equity*100;

  $("k-eq").textContent=fmt(d[d.length-1].equity);
  const open=$("k-open");
  if(data.target_cash==null){
    open.textContent="—";
  }else{
    open.textContent=fmt(data.target_cash);
    const od=d[d.length-1].equity-data.target_cash;
    $("k-open-s").innerHTML='对比当前 <span class="'+cls(od)+'">'+(od>=0?"+":"")+fmt(od)+" USD</span>";
  }
  const e1=$("k-day");e1.className="v "+cls(drPct);
  e1.textContent=(dr>=0?"+":"")+fmt(dr)+" USD";
  const e2=$("k-pnl");e2.className="v "+cls(pnl);
  e2.textContent=(pnl>=0?"+":"")+fmt(pnl)+" USD";

  drawAll();
  mtiles(data);
}

function drawAll(){
  if(!LAST)return;
  const d=flat(LAST);
  if(d.length<2)return;
  lineChart(d);
  barChart(d);
}

/* 窗口尺寸变化时按新容器宽度重绘图表（防抖 200ms） */
window.addEventListener("resize",()=>{
  clearTimeout(rzTimer);
  rzTimer=setTimeout(drawAll,200);
});

function lineChart(days){
  const box=$("chart-box");
  const {W,H,P,narrow}=chartGeom(box,300);
  days=downsample(days,W-P.l-P.r);
  const vs=days.map(d=>d.equity);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(lo===hi){lo*=0.99;hi*=1.01;}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const X=i=>P.l+(W-P.l-P.r)*(days.length<2?0:i/(days.length-1));
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));

  let g="";
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4,y=Y(v);
    g+='<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="rgba(15,23,42,.06)"/>'
      +'<text x="'+(P.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#64748b">'
      +(narrow?fmt(Math.round(v),0):fmt(v))+"</text>";
  }
  const step=Math.max(1,Math.ceil(days.length*52/(W-P.l-P.r)));
  for(let i=0;i<days.length;i+=step){
    g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#64748b">'+days[i].date.slice(5)+"</text>";
  }
  const pts=days.map((d,i)=>X(i).toFixed(1)+","+Y(d.equity).toFixed(1)).join(" L");
  const area="M"+X(0).toFixed(1)+","+Y(lo).toFixed(1)+" L"+pts+" L"+X(days.length-1).toFixed(1)+","+Y(lo).toFixed(1)+" Z";

  box.innerHTML=
  '<svg class="chart" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="rgba(14,165,233,.20)"/><stop offset="100%" stop-color="rgba(14,165,233,0)"/></linearGradient></defs>'
    +g
    +'<path d="'+area+'" fill="url(#g1)"/>'
    +'<path d="M'+pts+'" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle id="dot" r="4" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" style="display:none"/>'
    +'<line id="guide" y1="'+P.t+'" y2="'+(H-P.b)+'" stroke="rgba(14,165,233,.35)" style="display:none"/>'
    +'<rect x="'+P.l+'" y="'+P.t+'" width="'+(W-P.l-P.r)+'" height="'+(H-P.t-P.b)
    +'" fill="transparent" id="hit"/></svg>';

  const svg=box.firstElementChild,tip=$("tip");
  const dot=svg.querySelector("#dot"),guide=svg.querySelector("#guide"),hit=svg.querySelector("#hit");
  hit.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect();
    const i=Math.round(((e.clientX-r.left)/r.width*W-P.l)/(W-P.l-P.r)*(days.length-1));
    if(i<0||i>=days.length)return;
    const x=X(i),y=Y(days[i].equity);
    dot.setAttribute("cx",x);dot.setAttribute("cy",y);dot.style.display="block";
    guide.setAttribute("x1",x);guide.setAttribute("x2",x);guide.style.display="block";
    tip.style.display="block";
    tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";
    tip.innerHTML='<span class="d">'+days[i].date+" "+days[i].time.slice(11)+"</span><br>权益 "+fmt(days[i].equity)+" USD";
  });
  hit.addEventListener("mouseleave",()=>{
    dot.style.display="none";guide.style.display="none";tip.style.display="none";
  });
}

function barChart(days){
  const box=$("bar-box");
  const {W,H,P,narrow}=chartGeom(box,220);
  /* 相邻采样点差值先按桶开始时间降采样，再生成柱序列 */
  const src=downsample(days,W-P.l-P.r);
  const ds=[];
  for(let i=1;i<src.length;i++){
    ds.push({date:src[i].date,time:src[i].time,v:src[i].equity-src[i-1].equity});
  }
  if(!ds.length){box.innerHTML='<div class="empty">样本不足</div>';return;}

  const lo=Math.min(0,...ds.map(d=>d.v)),hi=Math.max(0,...ds.map(d=>d.v));
  const pad=(hi-lo)*0.15;
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-(lo-pad))/((hi+pad)-(lo-pad)));
  const bw=(W-P.l-P.r)/ds.length;

  let g="";
  [-1,0,1].forEach(k=>{
    const v=k===0?0:(k<0?lo:hi),y=Y(v);
    g+='<line x1="'+P.l+'" y1="'+y+'" x2="'+(W-P.r)+'" y2="'+y+'" stroke="rgba(15,23,42,.08)"/>'
      +'<text x="'+(P.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#64748b">'
      +(narrow?fmt(Math.round(v),0):fmt(v))+"</text>";
  });
  let bars="";
  ds.forEach((d,i)=>{
    const y0=Y(0),y1=Y(d.v);
    bars+='<rect x="'+(P.l+i*bw+bw*0.18).toFixed(1)+'" y="'+Math.min(y0,y1).toFixed(1)
      +'" width="'+Math.max(bw*0.64,1).toFixed(1)+'" height="'+Math.max(Math.abs(y1-y0),1).toFixed(1)
      +'" rx="2" fill="'+(d.v>=0?"#10b981":"#ef4444")+'"/>';
  });
  const step=Math.max(1,Math.ceil(ds.length*52/(W-P.l-P.r)));
  for(let i=0;i<ds.length;i+=step){
    g+='<text x="'+(P.l+(i+0.5)*bw)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#64748b">'+ds[i].date.slice(5)+"</text>";
  }
  box.innerHTML='<svg class="chart" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<rect id="hl" y="'+P.t+'" height="'+(H-P.t-P.b)+'" fill="rgba(14,165,233,.10)" style="display:none"/>'
    +g+bars
    +'<rect x="'+P.l+'" y="'+P.t+'" width="'+(W-P.l-P.r)+'" height="'+(H-P.t-P.b)
    +'" fill="transparent" id="bhit"/></svg>';

  const svg=box.firstElementChild,tip=$("tip");
  const hl=svg.querySelector("#hl"),hit=svg.querySelector("#bhit");
  hit.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect();
    const mx=(e.clientX-r.left)/r.width*W;
    const i=Math.floor((mx-P.l)/bw);
    if(i<0||i>=ds.length)return;
    hl.setAttribute("x",(P.l+i*bw).toFixed(1));
    hl.style.display="block";
    tip.style.display="block";
    tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";
    tip.innerHTML='<span class="d">'+ds[i].date+" "+(ds[i].time?ds[i].time.slice(11):"")+"</span><br>盈亏 "
      +(ds[i].v>=0?"+":"")+fmt(ds[i].v)+" USD";
  });
  hit.addEventListener("mouseleave",()=>{
    hl.style.display="none";tip.style.display="none";
  });
}

function mtiles(data){
  $("mtiles").innerHTML=data.months.map(m=>{
    const s=m.stats||{};
    return '<div class="card mtile"><div class="mm">'+m.month.slice(0,4)+"-"+m.month.slice(4)+' · 月度收益</div>'
      +'<div class="mv '+cls(s.return)+'">'+pct(s.return)+"</div>"
      +'<div class="ms">'+(s.count==null?"—":s.count)+" "+glText(data.granularity,"tile")+" · 期末 "+fmt(s.end_equity)+" USD</div></div>";
  }).join("");
}

load();
</script>
</body>
</html>
